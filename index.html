<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <title>My Tasks</title>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="app">

        <div class="header">
            <div class="header-top">
                <h1 class="app-title">My tasks</h1>
                <span class="date-label" id="dateLabel"></span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-num" id="statTotal">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="statDone">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="statDue">0</div>
                <div class="stat-label">Due today</div>
            </div>
        </div>

        <div class="add-row">
            <input type="text" id="taskInput" class="task-input" placeholder="Add a task…" />
            <select id="prioritySelect" class="priority-select">
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="low">Low</option>
            </select>
            <input type="date" id="dueInput" class="due-input" />
            <button id="addBtn" class="add-btn">
                <i class="ti ti-plus"></i> Add
            </button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="done">Completed</button>
            <button class="filter-btn" data-filter="high">High priority</button>
            <button class="filter-btn" data-filter="today">Due today</button>
        </div>

        <div id="taskContainer"></div>

    </div>

    <script src="app.js"></script>
    <script>
    (function () {
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let W, H;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        /* ── Stars ── */
        const STARS = Array.from({ length: 320 }, () => ({
            x: Math.random(),
            y: Math.random(),
            r: 0.3 + Math.random() * 1.4,
            twinkleSpeed: 0.4 + Math.random() * 1.2,
            twinkleOffset: Math.random() * Math.PI * 2,
            color: Math.random() < 0.3
                ? `hsl(${45 + Math.random() * 20},90%,90%)`
                : '#fff',
        }));

        /* ── Shooting stars ── */
        const SHOOTS = [];
        function spawnShoot() {
            SHOOTS.push({
                x: Math.random() * W,
                y: Math.random() * H * 0.5,
                len: 120 + Math.random() * 180,
                speed: 10 + Math.random() * 14,
                angle: Math.PI / 5 + (Math.random() - 0.5) * 0.3,
                life: 1,
                alpha: 0.9 + Math.random() * 0.1,
            });
        }
        setInterval(spawnShoot, 1800);
        spawnShoot();

        /* ── Nebula orbs (yellowish palette) ── */
        const ORBS = [
            { cx: 0.15, cy: 0.25, rx: 0.38, ry: 0.28, hue: 48,  sat: 95, lit: 55, alpha: 0.10 },
            { cx: 0.72, cy: 0.60, rx: 0.42, ry: 0.32, hue: 38,  sat: 90, lit: 50, alpha: 0.09 },
            { cx: 0.50, cy: 0.10, rx: 0.55, ry: 0.20, hue: 55,  sat: 85, lit: 60, alpha: 0.07 },
            { cx: 0.85, cy: 0.15, rx: 0.28, ry: 0.24, hue: 30,  sat: 95, lit: 60, alpha: 0.08 },
            { cx: 0.20, cy: 0.80, rx: 0.35, ry: 0.25, hue: 42,  sat: 88, lit: 52, alpha: 0.07 },
        ];
        // Drift state
        const ORBS_D = ORBS.map(() => ({
            dx: (Math.random() - 0.5) * 0.00008,
            dy: (Math.random() - 0.5) * 0.00008,
        }));

        /* ── Planets ── */
        const PLANETS = [
            {
                x: 0.82, y: 0.18, r: 52,
                bodyColor: '#f5c842',
                ringColor: 'rgba(255,210,80,0.35)',
                ringW: 110, ringH: 18,
                hasRing: true,
                glowColor: 'rgba(255,200,40,0.18)',
                glowR: 120,
                craters: [],
                bands: ['rgba(0,0,0,0.08)', 'rgba(255,255,255,0.06)'],
            },
            {
                x: 0.10, y: 0.72, r: 28,
                bodyColor: '#e8a020',
                ringColor: null,
                hasRing: false,
                glowColor: 'rgba(230,150,20,0.15)',
                glowR: 70,
                craters: [
                    { ox: -8, oy: -6, r: 5 },
                    { ox: 10, oy: 4, r: 3 },
                    { ox: -3, oy: 10, r: 4 },
                ],
                bands: [],
            },
        ];

        /* ── Dust particles ── */
        const DUST = Array.from({ length: 60 }, () => ({
            x: Math.random() * 1,
            y: Math.random() * 1,
            r: 0.5 + Math.random(),
            vx: (Math.random() - 0.5) * 0.00015,
            vy: (Math.random() - 0.5) * 0.00015,
            alpha: 0.1 + Math.random() * 0.3,
            hue: 40 + Math.random() * 25,
        }));

        let t = 0;

        function drawNebula() {
            ORBS.forEach((o, i) => {
                const d = ORBS_D[i];
                o.cx = Math.max(0.05, Math.min(0.95, o.cx + d.dx));
                o.cy = Math.max(0.05, Math.min(0.95, o.cy + d.dy));

                const cx = o.cx * W, cy = o.cy * H;
                const rx = o.rx * W, ry = o.ry * H;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(rx / 100, ry / 100);
                const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 100);
                g.addColorStop(0, `hsla(${o.hue},${o.sat}%,${o.lit}%,${o.alpha})`);
                g.addColorStop(0.5, `hsla(${o.hue},${o.sat}%,${o.lit}%,${o.alpha * 0.4})`);
                g.addColorStop(1, `hsla(${o.hue},${o.sat}%,${o.lit}%,0)`);
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(0, 0, 100, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawStars() {
            STARS.forEach(s => {
                const alpha = 0.5 + 0.5 * Math.sin(t * s.twinkleSpeed + s.twinkleOffset);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = s.color;
                ctx.beginPath();
                ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function drawShoots() {
            for (let i = SHOOTS.length - 1; i >= 0; i--) {
                const s = SHOOTS[i];
                const tx = s.x + Math.cos(s.angle) * s.len * (1 - s.life);
                const ty = s.y + Math.sin(s.angle) * s.len * (1 - s.life);
                const ex = tx + Math.cos(s.angle) * s.len * s.life;
                const ey = ty + Math.sin(s.angle) * s.len * s.life;
                const grad = ctx.createLinearGradient(tx, ty, ex, ey);
                grad.addColorStop(0, `rgba(255,240,160,0)`);
                grad.addColorStop(0.7, `rgba(255,230,100,${s.alpha * s.life})`);
                grad.addColorStop(1, `rgba(255,255,220,${s.alpha})`);
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(tx, ty);
                ctx.lineTo(ex, ey);
                ctx.stroke();
                s.x += Math.cos(s.angle) * s.speed;
                s.y += Math.sin(s.angle) * s.speed;
                s.life -= 0.018;
                if (s.life <= 0 || s.x > W + 200 || s.y > H + 200) SHOOTS.splice(i, 1);
            }
        }

        function drawPlanet(p) {
            const px = p.x * W, py = p.y * H;

            // glow
            const glow = ctx.createRadialGradient(px, py, p.r * 0.5, px, py, p.glowR);
            glow.addColorStop(0, p.glowColor);
            glow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(px, py, p.glowR, 0, Math.PI * 2);
            ctx.fill();

            // ring behind (if any)
            if (p.hasRing) {
                ctx.save();
                ctx.translate(px, py);
                ctx.scale(1, p.ringH / p.ringW);
                ctx.beginPath();
                ctx.ellipse(0, 0, p.ringW, p.ringW, Math.PI / 10, 0, Math.PI * 2);
                ctx.strokeStyle = p.ringColor;
                ctx.lineWidth = 10 * (p.ringW / p.ringH);
                ctx.stroke();
                ctx.restore();
            }

            // body
            const bodyG = ctx.createRadialGradient(px - p.r * 0.3, py - p.r * 0.3, p.r * 0.1, px, py, p.r);
            bodyG.addColorStop(0, lighten(p.bodyColor, 40));
            bodyG.addColorStop(0.5, p.bodyColor);
            bodyG.addColorStop(1, darken(p.bodyColor, 40));
            ctx.fillStyle = bodyG;
            ctx.beginPath();
            ctx.arc(px, py, p.r, 0, Math.PI * 2);
            ctx.fill();

            // bands
            p.bands.forEach((color, bi) => {
                ctx.save();
                ctx.beginPath();
                ctx.arc(px, py, p.r, 0, Math.PI * 2);
                ctx.clip();
                const yOff = (bi - 0.5) * p.r * 0.6;
                ctx.fillStyle = color;
                ctx.fillRect(px - p.r, py + yOff - p.r * 0.15, p.r * 2, p.r * 0.3);
                ctx.restore();
            });

            // craters
            p.craters.forEach(c => {
                ctx.beginPath();
                ctx.arc(px + c.ox, py + c.oy, c.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(px + c.ox - 1, py + c.oy - 1, c.r * 0.6, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.fill();
            });

            // shine
            const shine = ctx.createRadialGradient(px - p.r * 0.35, py - p.r * 0.35, 0, px - p.r * 0.2, py - p.r * 0.2, p.r * 0.65);
            shine.addColorStop(0, 'rgba(255,255,255,0.22)');
            shine.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.save();
            ctx.beginPath();
            ctx.arc(px, py, p.r, 0, Math.PI * 2);
            ctx.clip();
            ctx.fillStyle = shine;
            ctx.fillRect(px - p.r, py - p.r, p.r * 2, p.r * 2);
            ctx.restore();
        }

        function drawDust() {
            DUST.forEach(d => {
                d.x = (d.x + d.vx + 1) % 1;
                d.y = (d.y + d.vy + 1) % 1;
                ctx.beginPath();
                ctx.arc(d.x * W, d.y * H, d.r, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${d.hue},80%,70%,${d.alpha})`;
                ctx.fill();
            });
        }

        function lighten(hex, pct) {
            return shiftHex(hex, pct);
        }
        function darken(hex, pct) {
            return shiftHex(hex, -pct);
        }
        function shiftHex(hex, pct) {
            const n = parseInt(hex.slice(1), 16);
            const r = Math.min(255, Math.max(0, (n >> 16) + pct));
            const g = Math.min(255, Math.max(0, ((n >> 8) & 0xff) + pct));
            const b = Math.min(255, Math.max(0, (n & 0xff) + pct));
            return `rgb(${r},${g},${b})`;
        }

        function tick() {
            t += 0.016;
            ctx.clearRect(0, 0, W, H);

            // deep space bg
            const bg = ctx.createLinearGradient(0, 0, W * 0.5, H);
            bg.addColorStop(0, '#06040f');
            bg.addColorStop(0.4, '#0e0c1a');
            bg.addColorStop(1, '#100d05');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            drawNebula();
            drawStars();
            drawDust();
            PLANETS.forEach(drawPlanet);
            drawShoots();

            requestAnimationFrame(tick);
        }

        tick();
    })();
    </script>
</body>
</html>
